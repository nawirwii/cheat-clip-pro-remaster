name: Windows portable release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
      - name: Build frontend
        run: npm ci; npm run build
      - name: Fetch bundled FFmpeg + yt-dlp + aria2c (anti WinError 2)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/ffmpeg-bin | Out-Null
          function Invoke-DownloadWithRetry {
            param([string]$Url, [string]$OutFile, [int]$MaxAttempts = 4)
            for ($i = 1; $i -le $MaxAttempts; $i++) {
              try {
                Write-Host "Download attempt $i : $Url"
                if (Test-Path $OutFile) { Remove-Item $OutFile -Force -ErrorAction SilentlyContinue }
                Invoke-WebRequest -Uri $Url -OutFile $OutFile -UseBasicParsing
                if ((Test-Path $OutFile) -and ((Get-Item $OutFile).Length -gt 1MB)) { return $true }
                Write-Host "File too small, retrying..."
              } catch {
                Write-Host "Attempt $i failed: $($_.Exception.Message)"
              }
              Start-Sleep -Seconds (5 * $i)
            }
            return $false
          }
          # Mirror list: gyan.dev sering 503 dari runner, fallback ke GitHub (BtbN + GyanD)
          $ffUrls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          )
          $ok = $false
          foreach ($u in $ffUrls) {
            if (Invoke-DownloadWithRetry -Url $u -OutFile "$env:TEMP/ffmpeg.zip") {
              try {
                if (Test-Path "$env:TEMP/ffx") { Remove-Item -Recurse -Force "$env:TEMP/ffx" -ErrorAction SilentlyContinue }
                Expand-Archive -Path "$env:TEMP/ffmpeg.zip" -DestinationPath "$env:TEMP/ffx" -Force
                $ff = Get-ChildItem "$env:TEMP/ffx" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
                $fp = Get-ChildItem "$env:TEMP/ffx" -Recurse -Filter ffprobe.exe | Select-Object -First 1
                if ($ff -and $fp) {
                  Copy-Item $ff.FullName backend/ffmpeg-bin/ffmpeg.exe -Force
                  Copy-Item $fp.FullName backend/ffmpeg-bin/ffprobe.exe -Force
                  Write-Host "FFmpeg OK from $u"
                  $ok = $true
                  break
                } else {
                  Write-Host "ffmpeg.exe/ffprobe.exe not found in archive from $u"
                }
              } catch {
                Write-Host "Expand/copy failed for $u : $($_.Exception.Message)"
              }
            } else {
              Write-Host "Download failed for $u, trying next mirror..."
            }
          }
          if (-not $ok) { Write-Error "All FFmpeg mirrors failed"; exit 1 }
          $ydlUrl = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          if (-not (Invoke-DownloadWithRetry -Url $ydlUrl -OutFile "backend/ffmpeg-bin/yt-dlp.exe")) { Write-Error "yt-dlp download failed"; exit 1 }
          # v0.0.70: aria2c 1.37.0 (multi-connection downloader — the fix
          # for YouTube's per-connection throttle; see video_engine.py).
          # The PyInstaller spec already bundles the whole backend/
          # ffmpeg-bin/ dir, so aria2c.exe lands in _MEIPASS/ffmpeg-bin
          # next to ffmpeg/yt-dlp. Fail fast if it cannot be fetched:
          # a build without aria2c would silently ship the slow path.
          $aria2Url = "https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip"
          if (-not (Invoke-DownloadWithRetry -Url $aria2Url -OutFile "$env:TEMP/aria2.zip")) { Write-Error "aria2c download failed"; exit 1 }
          try {
            if (Test-Path "$env:TEMP/aria2x") { Remove-Item -Recurse -Force "$env:TEMP/aria2x" -ErrorAction SilentlyContinue }
            Expand-Archive -Path "$env:TEMP/aria2.zip" -DestinationPath "$env:TEMP/aria2x" -Force
            $a2 = Get-ChildItem "$env:TEMP/aria2x" -Recurse -Filter aria2c.exe | Select-Object -First 1
            if (-not $a2) { Write-Error "aria2c.exe not found in archive"; exit 1 }
            Copy-Item $a2.FullName backend/ffmpeg-bin/aria2c.exe -Force
            Write-Host "aria2c OK"
          } catch { Write-Error "aria2c extract/copy failed: $($_.Exception.Message)"; exit 1 }
          Get-ChildItem backend/ffmpeg-bin
          if (-not (Test-Path backend/ffmpeg-bin/ffmpeg.exe)) { Write-Error "ffmpeg.exe missing"; exit 1 }
          if (-not (Test-Path backend/ffmpeg-bin/ffprobe.exe)) { Write-Error "ffprobe.exe missing"; exit 1 }
          if (-not (Test-Path backend/ffmpeg-bin/yt-dlp.exe)) { Write-Error "yt-dlp.exe missing"; exit 1 }
          if (-not (Test-Path backend/ffmpeg-bin/aria2c.exe)) { Write-Error "aria2c.exe missing"; exit 1 }
      - name: Build backend sidecar
        run: python -m PyInstaller --clean --noconfirm packaging/backend.spec
      - name: Stage Tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/cheat-clip-pro-backend.exe src-tauri/binaries/cheat-clip-pro-backend-x86_64-pc-windows-msvc.exe -Force
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          if (Test-Path backend/fonts) { Copy-Item -Recurse -Force backend/fonts src-tauri/resources/fonts }
          if (Test-Path backend/cascades) { Copy-Item -Recurse -Force backend/cascades src-tauri/resources/cascades }
          if (Test-Path dist) { Copy-Item -Recurse -Force dist src-tauri/resources/dist }
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Build Tauri installer
        run: npx tauri build --bundles nsis
      - name: Prepare installer exe (named by tag)
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "CheatClipPro_${{ github.ref_name }}_windows_x64_installer.exe" -Force
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --verify-tag --title "Cheat Clip Pro ${{ github.ref_name }}" --generate-notes || true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} "CheatClipPro_${{ github.ref_name }}_windows_x64_installer.exe" --clobber