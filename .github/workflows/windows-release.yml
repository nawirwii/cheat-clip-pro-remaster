name: Windows portable release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller
      - name: Build frontend
        run: npm ci; npm run build
      - name: Build backend sidecar
        run: python -m PyInstaller --clean --noconfirm packaging/backend.spec
      - name: Stage Tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item dist/cheat-clip-pro-backend.exe src-tauri/binaries/cheat-clip-pro-backend-x86_64-pc-windows-msvc.exe -Force
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          if (Test-Path backend/fonts) { Copy-Item -Recurse -Force backend/fonts src-tauri/resources/fonts }
          if (Test-Path backend/cascades) { Copy-Item -Recurse -Force backend/cascades src-tauri/resources/cascades }
          if (Test-Path dist) { Copy-Item -Recurse -Force dist src-tauri/resources/dist }
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Build Tauri installer
        run: npx tauri build --bundles nsis
      - name: Create installer archive
        shell: pwsh
        run: |
          $out = "CheatClipPro_${{ github.ref_name }}_windows_x64_installer"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe $out/installer.exe
          Compress-Archive -Path $out -DestinationPath "$out.zip" -Force
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} --verify-tag --title "Cheat Clip Pro ${{ github.ref_name }}" --generate-notes || true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.ref_name }} "CheatClipPro_${{ github.ref_name }}_windows_x64_installer.zip" "src-tauri/target/release/bundle/nsis/*.exe" --clobber